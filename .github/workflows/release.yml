name: Release

on:
  push:
    tags: ["v*"]

jobs:
  release:
    name: Build and publish
    runs-on: ubuntu-latest
    environment: release
    permissions:
      contents: write   # create GitHub Release
      id-token: write   # PyPI trusted publishing (OIDC)

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0   # full history for git-cliff

      - name: Set up uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Install dependencies
        run: uv sync

      - name: Verify (non-mutating)
        run: make verify-ci

      - name: Verify tag matches pyproject version
        run: |
          VERSION=$(python -c "
          import tomllib
          with open('pyproject.toml', 'rb') as f:
              print(tomllib.load(f)['project']['version'])
          ")
          TAG="${GITHUB_REF_NAME#v}"
          if [ "$VERSION" != "$TAG" ]; then
            echo "error: tag v$TAG does not match pyproject version $VERSION"
            exit 1
          fi

      - name: Build
        run: uv build --no-sources

      # PyPI publishing is opt-in. Set repository variable PUBLISH_TO_PYPI="true"
      # (Settings → Secrets and variables → Actions → Variables) once a PyPI
      # trusted publisher is configured for this repo/workflow/environment.
      # Until then, releases are GitHub-only — the build artifacts are still
      # attached to the GitHub Release below.
      - name: Validate publish artifacts
        if: vars.PUBLISH_TO_PYPI == 'true'
        run: uv publish --dry-run

      - name: Publish to PyPI
        if: vars.PUBLISH_TO_PYPI == 'true'
        run: uv publish

      - name: Generate release notes
        run: uvx git-cliff --latest --strip all --output RELEASE_NOTES.md

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          body_path: RELEASE_NOTES.md
          files: dist/*

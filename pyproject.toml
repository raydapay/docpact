[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "docpact"
version = "0.1.0a3"
description = "Docstring contract validator for Python — MCP, FastAPI, and agent-facing code"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
keywords = ["docstring", "lint", "mcp", "fastmcp", "contracts", "ci"]
classifiers = [
    "Development Status :: 2 - Pre-Alpha",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Quality Assurance",
    "Typing :: Typed",
]
dependencies = [
    # Docstring parsing. See ADR-001 for why griffe is the chosen foundation.
    "griffe>=1.5,<2.0",
    # CLI framework. click is the standard choice; argparse considered but ergonomics worse for subcommands.
    "click>=8.1",
    # Structured terminal output.
    "rich>=13.9",
]

[project.optional-dependencies]
# pytest plugin for in-suite docstring contract validation. v0.2 target.
pytest = ["pytest>=8.0"]

[project.scripts]
docpact = "docpact.cli:main"

[project.urls]
Homepage = "https://github.com/raydapay/docpact"
Documentation = "https://github.com/raydapay/docpact/tree/main/docs"
Specification = "https://github.com/raydapay/docpact/blob/main/docs/spec/docpact-spec.md"
Issues = "https://github.com/raydapay/docpact/issues"

# --------------------------------------------------------------------------
# Development tooling
# --------------------------------------------------------------------------

[dependency-groups]
dev = [
    "ruff>=0.8",
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "pytest-xdist>=3.6",        # parallel test execution
    "ty",
    "hypothesis>=6.115",         # property-based testing for parser
    "coverage[toml]>=7.0",
]

# --------------------------------------------------------------------------
# ruff configuration
# --------------------------------------------------------------------------

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = [
    "E", "F", "W",   # pyflakes + pycodestyle
    "I",              # isort
    "B",              # flake8-bugbear
    "UP",             # pyupgrade
    "RUF",            # ruff-specific
    "SIM",            # flake8-simplify
    "TCH",            # flake8-type-checking
]
# D-series intentionally disabled. docpact handles docstring rules.
ignore = []

[tool.ruff.lint.per-file-ignores]
"tests/**/*.py" = ["D"]
"tests/fixtures/**/*.py" = ["F", "E", "W", "B", "UP", "RUF", "SIM"]

[tool.ruff.format]
quote-style = "double"

# --------------------------------------------------------------------------
# pytest configuration
# --------------------------------------------------------------------------

[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
addopts = [
    "--strict-markers",
    "--strict-config",
    "-ra",
]

[tool.coverage.run]
source = ["src/docpact"]
branch = true
# Stub modules (raise NotImplementedError) are omitted until implemented.
# Remove each path from this list when the module ships with tests.
omit = [
    "src/docpact/__main__.py",
    "src/docpact/rules/doc/doc098_doctest_exception.py",
]

[tool.coverage.report]
fail_under = 85
exclude_lines = [
    "pragma: no cover",
    "if TYPE_CHECKING:",
    "raise NotImplementedError",
]

# --------------------------------------------------------------------------
# docpact self-application (dogfooding)
# --------------------------------------------------------------------------

[tool.docpact]
schema = "1"
format = "google"
select = ["DOC", "MCP", "FIX", "TY", "PARSE"]
suppress_comment = ["nodo"]
# tests/ is excluded: test functions have no docstrings by convention and
# Tier 2 DOC001 noise would drown real signal. scripts/ is excluded for
# the same reason (dev-only tooling, not the public library surface).
exclude = ["tests/", "scripts/"]

[tool.docpact.per-file-ignores]
# Rule check() functions all share the same (FunctionInfo, ParsedDocstring|None, RuleConfig)
# → list[RuleResult] signature. Args/Returns sections would be structurally identical
# boilerplate across every rule with zero signal. The module docstring of each rule file
# is where the substantive documentation lives; the check() summary line is sufficient.
"src/docpact/rules/*/*.py" = ["DOC012"]

# --------------------------------------------------------------------------
# Release tooling (bump-my-version)
# --------------------------------------------------------------------------

[tool.bumpversion]
current_version = "0.1.0a3"
parse = "(?P<major>\\d+)\\.(?P<minor>\\d+)\\.(?P<patch>\\d+)((?P<pre_l>a|b|rc)(?P<pre_n>\\d+))?"
serialize = [
    "{major}.{minor}.{patch}{pre_l}{pre_n}",
    "{major}.{minor}.{patch}",
]
commit = false
tag = false

[[tool.bumpversion.files]]
filename = "pyproject.toml"
search = 'version = "{current_version}"'
replace = 'version = "{new_version}"'

[[tool.bumpversion.files]]
filename = "README.md"
search = "rev: v{current_version}"
replace = "rev: v{new_version}"

[[tool.bumpversion.files]]
filename = "docs/spec/docpact-spec.md"
search = "rev: v{current_version}"
replace = "rev: v{new_version}"

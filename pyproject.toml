[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "docpact"
version = "0.1.0.dev0"
description = "Docstring contract validator for Python — MCP, FastAPI, and agent-facing code"
readme = "README.md"
requires-python = ">=3.12"
license = "MIT"
keywords = ["docstring", "lint", "mcp", "fastmcp", "contracts", "ci"]
classifiers = [
    "Development Status :: 2 - Pre-Alpha",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Quality Assurance",
    "Typing :: Typed",
]
dependencies = [
    # Docstring parsing. See ADR-001 for why griffe is the chosen foundation.
    "griffe>=1.5",
    # CLI framework. click is the standard choice; argparse considered but ergonomics worse for subcommands.
    "click>=8.1",
    # Structured terminal output.
    "rich>=13.9",
]

[project.optional-dependencies]
# pytest plugin for in-suite docstring contract validation. v0.2 target.
pytest = ["pytest>=8.0"]

[project.scripts]
docpact = "docpact.cli:main"

[project.urls]
Homepage = "https://github.com/your-org/docpact"
Documentation = "https://github.com/your-org/docpact/tree/main/docs"
Specification = "https://github.com/your-org/docpact/blob/main/docs/spec/docpact-spec.md"
Issues = "https://github.com/your-org/docpact/issues"

# --------------------------------------------------------------------------
# Development tooling
# --------------------------------------------------------------------------

[dependency-groups]
dev = [
    "ruff>=0.8",
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "pytest-xdist>=3.6",        # parallel test execution
    "ty",
    "hypothesis>=6.115",         # property-based testing for parser
    "coverage[toml]>=7.0",
]

# --------------------------------------------------------------------------
# ruff configuration
# --------------------------------------------------------------------------

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = [
    "E", "F", "W",   # pyflakes + pycodestyle
    "I",              # isort
    "B",              # flake8-bugbear
    "UP",             # pyupgrade
    "RUF",            # ruff-specific
    "SIM",            # flake8-simplify
    "TCH",            # flake8-type-checking
]
# D-series intentionally disabled. docpact will handle docstring rules.
# (Once docpact bootstraps, it will lint its own docstrings.)
ignore = []

[tool.ruff.lint.per-file-ignores]
"tests/**/*.py" = ["D"]
"tests/fixtures/**/*.py" = ["F", "E", "W", "B", "UP", "RUF", "SIM"]

[tool.ruff.format]
quote-style = "double"

# --------------------------------------------------------------------------
# pytest configuration
# --------------------------------------------------------------------------

[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
addopts = [
    "--strict-markers",
    "--strict-config",
    "-ra",
]

[tool.coverage.run]
source = ["src/docpact"]
branch = true
# Stub modules (raise NotImplementedError) are omitted until implemented.
# Remove each path from this list when the module ships with tests.
omit = [
    "src/docpact/__main__.py",
    "src/docpact/rules/doc/doc050_pydantic_field.py",
    "src/docpact/rules/doc/doc098_doctest_exception.py",
]

[tool.coverage.report]
fail_under = 85
exclude_lines = [
    "pragma: no cover",
    "if TYPE_CHECKING:",
    "raise NotImplementedError",
]

# --------------------------------------------------------------------------
# docpact configuration (eating its own dogfood, once implemented)
# --------------------------------------------------------------------------

[tool.docpact]
schema = "1"
format = "google"
select = ["DOC", "MCP"]
exclude = ["tests/fixtures/"]
